[workspace]
members = [
    "crates/blelog-format",
    "firmware",
    "tools/blelog-cli",
]
default-members = [
    "crates/blelog-format",
    "tools/blelog-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
authors = ["JuusoPaju <143593092+JuusoPaju@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = true
opt-level = "z"
