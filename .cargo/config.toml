[alias]
firmware-build = "build -p ble-logger-firmware --target xtensa-esp32s3-espidf"
firmware-run = "run -p ble-logger-firmware --target xtensa-esp32s3-espidf"
firmware-check = "check -p ble-logger-firmware --target xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "scripts/flash-firmware.sh"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_SYS_ROOT_CRATE = "ble-logger-firmware"
CARGO_WORKSPACE_DIR = { value = "", relative = true }
